<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gym Tracker">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icon2.png">
<title>Gym Tracker</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#ffffff;--bg2:#f5f5f4;--bg3:#eeece8;
    --text:#1c1c1a;--text2:#6b6b68;--text3:#9b9b98;
    --border:rgba(0,0,0,0.12);--border2:rgba(0,0,0,0.2);
    --green-bg:#eaf3de;--green-text:#3b6d11;
    --blue-bg:#e6f1fb;--blue-text:#185fa5;
    --red-bg:#fcebeb;--red-text:#a32d2d;
    --radius:10px;--radius-sm:6px;
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  @media(prefers-color-scheme:dark){
    :root{
      --bg:#1c1c1e;--bg2:#2c2c2e;--bg3:#3a3a3c;
      --text:#f2f2f7;--text2:#aeaeb2;--text3:#6e6e73;
      --border:rgba(255,255,255,0.12);--border2:rgba(255,255,255,0.22);
      --green-bg:#1a3a0a;--green-text:#9fdb6a;
      --blue-bg:#0a2a4a;--blue-text:#82c0f7;
      --red-bg:#3a0a0a;--red-text:#f28b8b;
    }
  }
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
  body{display:flex;flex-direction:column;overflow:hidden}
  #topbar{background:var(--bg);border-bottom:0.5px solid var(--border);padding:12px 16px 10px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;padding-top:calc(12px + env(safe-area-inset-top,0px))}
  #bottomnav{background:var(--bg);border-top:0.5px solid var(--border);display:flex;flex-shrink:0;padding-bottom:var(--safe-bottom)}
  #bottomnav button{flex:1;border:none;background:none;color:var(--text2);font-size:10px;padding:8px 4px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:color 0.15s}
  #bottomnav button.active{color:var(--text)}
  #bottomnav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  #main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px;padding-bottom:24px}
  .card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
  .card-body{padding:12px 14px}
  .card-row{padding:11px 14px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px}
  .card-row:last-child{border-bottom:none}
  h2{font-size:20px;font-weight:600;letter-spacing:-0.4px;margin-bottom:14px}
  h3{font-size:13px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.04em;margin:18px 0 8px}
  h3:first-child{margin-top:0}
  button.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;border-radius:var(--radius-sm);padding:8px 14px;border:0.5px solid var(--border2);background:var(--bg2);color:var(--text);transition:opacity 0.15s,transform 0.1s;-webkit-tap-highlight-color:transparent}
  button.btn:active{opacity:0.7;transform:scale(0.97)}
  button.btn.primary{background:var(--text);color:var(--bg);border-color:var(--text)}
  button.btn.danger{color:var(--red-text);border-color:var(--red-text)}
  button.btn.full{width:100%;margin-bottom:8px}
  button.btn.sm{font-size:12px;padding:5px 10px}
  .pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px}
  .pill.plus{background:var(--green-bg);color:var(--green-text)}
  .pill.dot{background:var(--blue-bg);color:var(--blue-text)}
  .pill.minus{background:var(--red-bg);color:var(--red-text)}
  .pill.empty{background:var(--bg2);color:var(--text3)}
  .tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;background:var(--bg3);color:var(--text2)}
  input[type=text],input[type=number],input[type=password],textarea,select{
    font-family:inherit;font-size:15px;color:var(--text);background:var(--bg2);
    border:0.5px solid var(--border);border-radius:var(--radius-sm);
    padding:9px 11px;width:100%;outline:none;-webkit-appearance:none;
  }
  textarea{resize:none;min-height:80px;line-height:1.5}
  select{cursor:pointer}
  .form-label{font-size:12px;color:var(--text2);margin-bottom:4px;font-weight:500}
  .form-group{margin-bottom:12px}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.04em;padding:8px 10px;border-bottom:0.5px solid var(--border);text-align:left}
  td{padding:9px 10px;border-bottom:0.5px solid var(--border);vertical-align:middle;color:var(--text)}
  tr:last-child td{border-bottom:none}
  .progress-bar{height:3px;background:var(--bg3);border-radius:3px;margin-bottom:14px}
  .progress-fill{height:3px;background:var(--text);border-radius:3px;transition:width 0.4s ease}
  .day-card{display:block;width:100%;text-align:left;background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background 0.15s}
  .day-card:active{background:var(--bg2)}
  .day-num{font-size:11px;color:var(--text2);font-weight:500;margin-bottom:3px}
  .day-name{font-size:16px;font-weight:600;margin-bottom:2px}
  .day-meta{font-size:12px;color:var(--text3)}
  .resume-banner{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
  .ex-header{padding:12px 14px;border-bottom:0.5px solid var(--border)}
  .ex-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .set-row{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:0.5px solid var(--border)}
  .set-row:last-child{border-bottom:none}
  .msg{border-radius:var(--radius-sm);padding:9px 12px;font-size:13px;margin-bottom:12px;text-align:center}
  .msg.info{background:var(--bg2);color:var(--text2)}
  .msg.success{background:var(--green-bg);color:var(--green-text)}
  .msg.error{background:var(--red-bg);color:var(--red-text)}
  .checkbox-row{display:flex;align-items:center;gap:8px;font-size:14px}
  .checkbox-row input{width:18px;height:18px;cursor:pointer;flex-shrink:0}
  .empty-state{text-align:center;padding:40px 20px;color:var(--text3);font-size:14px}
  .note-text{font-size:12px;color:var(--text2);font-style:italic}
  .section-label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;margin:20px 0 6px;padding:0 2px}
  .section-label:first-child{margin-top:0}
  .sync-bar{font-size:11px;color:var(--text3);text-align:center;padding:4px;flex-shrink:0;min-height:20px}
  /* Setup screen */
  .setup-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;padding:24px}
  .setup-card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius);padding:20px;width:100%;max-width:400px}
  .setup-title{font-size:18px;font-weight:600;margin-bottom:6px}
  .setup-sub{font-size:13px;color:var(--text2);margin-bottom:20px;line-height:1.5}
  .setup-step{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.05em;margin:16px 0 4px}
</style>
</head>
<body>

<div id="topbar">
  <div>
    <div id="topbar-title" style="font-size:17px;font-weight:600;letter-spacing:-0.3px">Gym Tracker</div>
    <div id="topbar-sub" style="font-size:12px;color:var(--text2);margin-top:1px"></div>
  </div>
  <div id="topbar-action"></div>
</div>

<div id="main"></div>
<div class="sync-bar" id="sync-bar"></div>

<nav id="bottomnav">
  <button onclick="setView('dashboard')" id="nav-dashboard">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    Days
  </button>
  <button onclick="setView('workout')" id="nav-workout">
    <svg viewBox="0 0 24 24"><path d="M6 12h2m8 0h2M8 12V8a2 2 0 014 0v8a2 2 0 004 0V8"/></svg>
    Workout
  </button>
  <button onclick="setView('summary')" id="nav-summary">
    <svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/></svg>
    Summary
  </button>
  <button onclick="setView('editor')" id="nav-editor">
    <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
    Edit
  </button>
  <button onclick="setView('exportpage')" id="nav-exportpage">
    <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    Export
  </button>
</nav>

<script>
// ============================================================
// DATA MODEL
// ============================================================
const DAY_NAMES = ["","Upper Pull","Lower Glute Heavy","Upper Push","Lower + Core"];

const DEFAULT_PROGRAM = [
  {day:1,name:"Seated row",weight:45,perHand:false,startRes:0,symbol:"•",topRep:7,sets:3,repMin:8,repMax:10,notes:""},
  {day:1,name:"Lat pulldown",weight:39,perHand:false,startRes:0,symbol:"•",topRep:10,sets:3,repMin:10,repMax:12,notes:""},
  {day:1,name:"Single-arm DB row",weight:12,perHand:true,startRes:0,symbol:"+",topRep:12,sets:3,repMin:10,repMax:12,notes:""},
  {day:1,name:"Reverse pec deck",weight:25,perHand:false,startRes:0,symbol:"•",topRep:10,sets:3,repMin:10,repMax:12,notes:""},
  {day:1,name:"Seated hammer curls",weight:5,perHand:true,startRes:0,symbol:"+",topRep:12,sets:3,repMin:8,repMax:10,notes:""},
  {day:1,name:"Cardio",weight:0,perHand:false,startRes:0,symbol:"•",topRep:0,sets:1,repMin:30,repMax:30,notes:"30–33 min, 2.23 km / 84 flights",isCardio:true},
  {day:2,name:"Hip thrust",weight:37.5,perHand:false,startRes:22.7,symbol:"+",topRep:15,sets:3,repMin:6,repMax:8,notes:""},
  {day:2,name:"Leg press",weight:110,perHand:false,startRes:75.7,symbol:"+",topRep:15,sets:3,repMin:12,repMax:15,notes:""},
  {day:2,name:"Dumbbell split squat",weight:4,perHand:false,startRes:0,symbol:"+",topRep:10,sets:3,repMin:8,repMax:10,notes:""},
  {day:2,name:"Hip abduction",weight:54,perHand:false,startRes:0,symbol:"•",topRep:15,sets:3,repMin:12,repMax:15,notes:""},
  {day:2,name:"Hip adduction",weight:36,perHand:false,startRes:0,symbol:"+",topRep:15,sets:3,repMin:12,repMax:15,notes:""},
  {day:2,name:"Cable kickback",weight:0,perHand:false,startRes:0,symbol:"",topRep:0,sets:3,repMin:12,repMax:20,notes:"2–3 × 12–20"},
  {day:3,name:"Bench press",weight:0,perHand:false,startRes:0,symbol:"",topRep:0,sets:3,repMin:8,repMax:10,notes:""},
  {day:3,name:"Incline machine press",weight:15,perHand:false,startRes:6.8,symbol:"•",topRep:10,sets:3,repMin:8,repMax:10,notes:""},
  {day:3,name:"Dumbbell shoulder press",weight:8,perHand:true,startRes:0,symbol:"•",topRep:10,sets:3,repMin:8,repMax:12,notes:""},
  {day:3,name:"Lateral raises",weight:5,perHand:false,startRes:0,symbol:"•",topRep:8,sets:3,repMin:12,repMax:15,notes:""},
  {day:3,name:"Cable rope pushdown",weight:11.3,perHand:false,startRes:0,symbol:"•",topRep:12,sets:3,repMin:12,repMax:15,notes:""},
  {day:3,name:"Cardio",weight:0,perHand:false,startRes:0,symbol:"•",topRep:0,sets:1,repMin:30,repMax:30,notes:"30–33 min, 1.94–2.23 km",isCardio:true},
  {day:4,name:"Front squat",weight:20,perHand:false,startRes:0,symbol:"•",topRep:0,sets:3,repMin:3,repMax:5,notes:""},
  {day:4,name:"Cable Romanian deadlift",weight:0,perHand:false,startRes:0,symbol:"",topRep:0,sets:3,repMin:8,repMax:12,notes:""},
  {day:4,name:"Step-ups",weight:10,perHand:true,startRes:0,symbol:"+",topRep:12,sets:3,repMin:10,repMax:12,notes:""},
  {day:4,name:"Prone leg curl",weight:27,perHand:false,startRes:0,symbol:"+",topRep:12,sets:3,repMin:10,repMax:12,notes:""},
  {day:4,name:"Dead bugs",weight:5,perHand:false,startRes:0,symbol:"+",topRep:12,sets:3,repMin:10,repMax:12,notes:""},
  {day:4,name:"Pallof press",weight:9,perHand:false,startRes:0,symbol:"+",topRep:15,sets:3,repMin:10,repMax:15,notes:""},
  {day:4,name:"Plank",weight:0,perHand:false,startRes:0,symbol:"•",topRep:47,sets:3,repMin:45,repMax:75,notes:"seconds",isTime:true},
];

// ============================================================
// STORAGE — all in localStorage, token never in code
// ============================================================
function load(key, def) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch { return def; }
}
function save(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}

// Gist credentials stored only in localStorage on the user's device
function getGistToken() { return localStorage.getItem('wt_gist_token') || ''; }
function getGistId()    { return localStorage.getItem('wt_gist_id')    || ''; }
function saveGistCreds(token, id) {
  localStorage.setItem('wt_gist_token', token);
  localStorage.setItem('wt_gist_id', id);
}
function clearGistCreds() {
  localStorage.removeItem('wt_gist_token');
  localStorage.removeItem('wt_gist_id');
}

const GIST_FILE = 'gym-tracker-data.json';

let program = load('wt_program', DEFAULT_PROGRAM.map((e,i) => ({...e, id:i})));
let session  = load('wt_session', null);
let history  = load('wt_history', []);

function saveAll() {
  save('wt_program', program);
  save('wt_session', session);
  save('wt_history', history);
}

// ============================================================
// GIST SYNC
// ============================================================
function setSyncBar(msg) {
  const bar = document.getElementById('sync-bar');
  if (bar) bar.textContent = msg;
}

async function syncToGist() {
  const token = getGistToken();
  const gistId = getGistId();
  if (!token || !gistId) return;
  setSyncBar('Saving to cloud…');
  try {
    const data = { program, history, savedAt: new Date().toISOString() };
    const res = await fetch(`https://api.github.com/gists/${gistId}`, {
      method: 'PATCH',
      headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ files: { [GIST_FILE]: { content: JSON.stringify(data, null, 2) } } })
    });
    if (res.ok) {
      setSyncBar('Cloud saved ✓ ' + new Date().toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit'}));
    } else {
      setSyncBar('Cloud save failed — check your token');
    }
  } catch(e) {
    setSyncBar('Cloud save failed (offline?)');
  }
}

async function loadFromGist() {
  const token = getGistToken();
  const gistId = getGistId();
  if (!token || !gistId) return false;
  setSyncBar('Loading from cloud…');
  try {
    const res = await fetch(`https://api.github.com/gists/${gistId}`, {
      headers: { 'Authorization': `token ${token}` }
    });
    if (!res.ok) { setSyncBar('Could not reach Gist'); return false; }
    const gist = await res.json();
    const file = gist.files[GIST_FILE];
    if (!file || !file.content || file.content.trim() === '{}') { setSyncBar(''); return false; }
    const data = JSON.parse(file.content);
    if (data.program && data.program.length > 0) {
      program = data.program;
      history = data.history || [];
      saveAll();
      setSyncBar('Loaded from cloud ✓');
      return true;
    }
    setSyncBar('');
    return false;
  } catch(e) {
    setSyncBar('');
    return false;
  }
}

// ============================================================
// CORE LOGIC
// ============================================================
function parseSetInput(input) {
  return input.trim().split('\n').map(line => {
    line = line.trim();
    const m = line.match(/^(\d+\.?\d*)\s*[xX×]\s*(\d+)/);
    if (m) return { weight: parseFloat(m[1]), reps: parseInt(m[2]) };
    return null;
  }).filter(Boolean);
}

function calculateTopSet(sets, repMin, repMax) {
  if (!sets || !sets.length) return null;
  const inRange = sets.filter(s => s.reps >= repMin && s.reps <= repMax);
  if (inRange.length > 0) return inRange.sort((a,b) => b.reps-a.reps || b.weight-a.weight)[0];
  return [...sets].sort((a,b) => b.weight-a.weight || b.reps-a.reps)[0];
}

function calculateProgression(topSet, repMin, repMax) {
  if (!topSet) return "";
  if (topSet.reps >= repMax) return "+";
  if (topSet.reps >= repMin) return "•";
  return "-";
}

// Only update stored weight if reps were achieved (• or +).
// A failed set (−) keeps the existing weight — treat it as a bad day, not a new baseline.
function maybeUpdateWeight(ex, topSet, sym) {
  if (!ex || !topSet || ex.isCardio || ex.isTime) return;
  if ((sym === '+' || sym === '•') && topSet.weight !== ex.weight) {
    ex.weight = topSet.weight;
  }
}

function formatWeightShort(ex) {
  if (ex.isCardio || ex.isTime) return ex.notes || "—";
  if (!ex.weight && !ex.startRes) return "—";
  if (ex.startRes) return `${Math.round((ex.startRes + ex.weight)*10)/10} kg`;
  if (!ex.weight) return "—";
  return ex.weight + (ex.perHand ? " /hand" : "") + " kg";
}

function formatWeightFull(ex) {
  if (!ex.weight && !ex.startRes) return "—";
  if (ex.startRes) {
    const total = Math.round((ex.startRes + ex.weight)*10)/10;
    return `(${ex.startRes})+${ex.weight} = ${total} kg`;
  }
  return ex.weight + (ex.perHand ? " /hand" : "") + " kg";
}

function pillClass(sym) {
  if (sym==="+") return "plus";
  if (sym==="•") return "dot";
  if (sym==="-") return "minus";
  return "empty";
}

// ============================================================
// STATE
// ============================================================
let view = "dashboard";
let editorDay = 1;
let editingId = null;
let editDraft = {};
let flashMsg = "";
let flashType = "info";
let setInputVal = "";

function setView(v) { view=v; editingId=null; render(); }

function showMsg(m, type='info') {
  flashMsg=m; flashType=type; render();
  setTimeout(()=>{ flashMsg=""; render(); }, 2500);
}

// ============================================================
// RENDER ENGINE
// ============================================================
function el(tag, attrs={}, children=[]) {
  const e = document.createElement(tag);
  Object.entries(attrs).forEach(([k,v]) => {
    if (k==='class') e.className=v;
    else if (k==='style') e.style.cssText=v;
    else if (k.startsWith('on')) e[k]=v;
    else if (k==='html') e.innerHTML=v;
    else e.setAttribute(k,v);
  });
  children.forEach(c => {
    if (typeof c==='string') e.appendChild(document.createTextNode(c));
    else if (c) e.appendChild(c);
  });
  return e;
}

function render() {
  ['dashboard','workout','summary','editor','exportpage'].forEach(v => {
    const b = document.getElementById('nav-'+v);
    if (b) b.className = view===v ? 'active' : '';
  });
  const titles = {
    dashboard:  ['Gym Tracker',''],
    workout:    session&&!session.done ? [`Day ${session.day} — ${DAY_NAMES[session.day]}`,''] : ['Workout',''],
    summary:    ['Summary',''],
    editor:     ['Edit Program', `Day ${editorDay} — ${DAY_NAMES[editorDay]}`],
    exportpage: ['Export / Sync','']
  };
  const [title,sub] = titles[view]||['Gym Tracker',''];
  document.getElementById('topbar-title').textContent = title;
  document.getElementById('topbar-sub').textContent = sub;
  document.getElementById('topbar-action').innerHTML = '';
  const main = document.getElementById('main');
  main.innerHTML = '';
  if (flashMsg) main.appendChild(el('div',{class:`msg ${flashType}`},[flashMsg]));
  try { if (view==='dashboard') renderDashboard(main);
  else if (view==='workout')     renderWorkout(main);
  else if (view==='summary')     renderSummary(main);
  else if (view==='editor')      renderEditor(main);
  else if (view==='exportpage') renderExportPage(main); } catch(e) { main.innerHTML='<div class="msg error" style="margin-top:20px">Error: '+e.message+'<br><br><button class="btn" onclick="location.reload()">Reload</button></div>'; }
}

// ============================================================
// SETUP SCREEN — shown inside Export tab if no creds saved
// ============================================================
function renderSetup(main) {
  const wrap = el('div', {class:'setup-wrap'});
  const card = el('div', {class:'setup-card'});

function startWorkout(d) {
  if (session&&!session.done) {
    if (!confirm(`Abandon current Day ${session.day} session and start Day ${d}?`)) return;
  }
  const exes = program.filter(e=>e.day===d);
  const loggedSets={}, notes={};
  exes.forEach(e=>{loggedSets[e.id]=[]; notes[e.id]="";});
  session={day:d,exIndex:0,loggedSets,notes,dayNotes:"",done:false};
  setInputVal="";
  saveAll();
  setView('workout');
}

// WORKOUT
// ============================================================
function renderWorkout(main) {
  if (!session||session.done) {
    main.appendChild(el('div',{class:'empty-state'},[
      'No active session.',el('br'),el('br'),
      el('button',{class:'btn primary',onclick:()=>setView('dashboard')},['Choose a day'])
    ]));
    return;
  }
  const dayExes = program.filter(e=>e.day===session.day);
  const curEx = dayExes[session.exIndex];
  const pct = Math.round(session.exIndex/dayExes.length*100);
  const pb = el('div',{class:'progress-bar'});
  pb.appendChild(el('div',{class:'progress-fill',style:`width:${pct}%`}));
  main.appendChild(pb);

  if (curEx) {
    const card = el('div',{class:'card'});
    const hdr = el('div',{class:'ex-header'});
    const hdrTop = el('div',{style:'display:flex;align-items:flex-start;justify-content:space-between'});
    const nameBlock = el('div');
    nameBlock.innerHTML=`<div style="font-size:11px;color:var(--text2);font-weight:500;margin-bottom:2px">${session.exIndex+1} of ${dayExes.length}</div><div style="font-size:17px;font-weight:600">${curEx.name}</div>`;
    hdrTop.appendChild(nameBlock);
    const hdrBtns = el('div',{style:'display:flex;gap:6px'});
    if (session.exIndex > 0) {
      hdrBtns.appendChild(el('button',{class:'btn sm',onclick:()=>{
        setInputVal=""; session.exIndex--; saveAll(); render();
      }},['← Back']));
    }
    hdrBtns.appendChild(el('button',{class:'btn sm',onclick:skipExercise},['Skip']));
    hdrTop.appendChild(hdrBtns);
    hdr.appendChild(hdrTop);
    const meta = el('div',{class:'ex-meta'});
    if (!curEx.isCardio&&!curEx.isTime) meta.appendChild(el('span',{class:'tag'},[formatWeightFull(curEx)]));
    meta.appendChild(el('span',{class:'tag'},[`${curEx.sets}×${curEx.repMin}–${curEx.repMax}`]));
    if (curEx.symbol) meta.appendChild(el('span',{class:`pill ${pillClass(curEx.symbol)}`},[curEx.symbol]));
    if (curEx.notes) meta.appendChild(el('span',{class:'tag'},[curEx.notes]));
    hdr.appendChild(meta);
    card.appendChild(hdr);

    const logged = session.loggedSets[curEx.id]||[];
    logged.forEach((s,i)=>{
      const row = el('div',{class:'set-row'});
      row.innerHTML=`<span style="font-size:13px;color:var(--text2)">Set ${i+1}</span><span style="font-weight:500">${s.weight} kg × ${s.reps}</span>`;
      row.appendChild(el('button',{class:'btn sm danger',onclick:()=>removeSet(curEx.id,i)},['✕']));
      card.appendChild(row);
    });

    const body = el('div',{class:'card-body'});
    body.appendChild(el('div',{class:'form-label'},['Log sets — one per line (e.g. 45 × 10)']));
    const ta = el('textarea',{placeholder:`weight × reps\ne.g. 45 × 10`});
    ta.id='set-input'; ta.value=setInputVal;
    ta.oninput=()=>setInputVal=ta.value;
    body.appendChild(ta);
    const btnRow = el('div',{style:'display:flex;gap:8px;margin-top:10px'});
    btnRow.appendChild(el('button',{class:'btn',style:'flex:1',onclick:()=>logSets(curEx.id)},['Add sets']));
    btnRow.appendChild(el('button',{class:'btn primary',style:'flex:1',onclick:()=>completeExercise(curEx.id)},['Done ›']));
    body.appendChild(btnRow);
    body.appendChild(el('div',{class:'form-label',style:'margin-top:12px'},['Notes (optional)']));
    const noteIn = el('input',{type:'text',placeholder:'e.g. left wrist irritation'});
    noteIn.value=session.notes[curEx.id]||'';
    noteIn.oninput=()=>{session.notes[curEx.id]=noteIn.value; save('wt_session',session);};
    body.appendChild(noteIn);
    card.appendChild(body);
    main.appendChild(card);
  } else {
    main.appendChild(el('div',{class:'card card-body',style:'text-align:center'},[
      el('div',{style:'font-size:28px;margin-bottom:8px'},['✓']),
      el('div',{style:'font-weight:600;font-size:16px'},['All exercises logged']),
      el('div',{style:'font-size:13px;color:var(--text2);margin-top:4px'},['Add day notes below, then finish.'])
    ]));
  }

  const dnCard = el('div',{class:'card card-body'});
  dnCard.appendChild(el('div',{class:'form-label'},['Day notes']));
  const dnIn = el('textarea'); dnIn.style.minHeight='60px';
  dnIn.placeholder='General notes for this session...';
  dnIn.value=session.dayNotes||'';
  dnIn.oninput=()=>{session.dayNotes=dnIn.value; save('wt_session',session);};
  dnCard.appendChild(dnIn);
  dnCard.appendChild(el('button',{class:'btn primary full',style:'margin-top:10px',onclick:finishWorkout},['Finish workout']));
  main.appendChild(dnCard);

  main.appendChild(el('div',{class:'section-label'},['All exercises']));
  const listCard = el('div',{class:'card'});
  dayExes.forEach((e,i)=>{
    const isDone=i<session.exIndex, isCur=i===session.exIndex;
    const row = el('div',{class:'card-row'});
    row.appendChild(el('span',{style:`font-size:14px;${isDone?'text-decoration:line-through;color:var(--text3)':''}${isCur?'font-weight:600':''}`},[e.name]));
    const right = el('div',{style:'display:flex;align-items:center;gap:6px'});
    if (isDone) {
      const lg=session.loggedSets[e.id]||[];
      if (lg.length>0) {
        const ts=calculateTopSet(lg,e.repMin,e.repMax);
        const sym=calculateProgression(ts,e.repMin,e.repMax);
        right.appendChild(el('span',{class:`pill ${pillClass(sym)}`},[sym]));
      }
    } else if (isCur) {
      right.appendChild(el('span',{class:'tag'},['now']));
    } else {
      right.appendChild(el('span',{style:'font-size:13px;color:var(--text3)'},[formatWeightShort(e)]));
    }
    row.appendChild(right);
    listCard.appendChild(row);
  });

  // Cancel button — all the way at the bottom, below exercise list
  const cancelBtn = el('button',{class:'btn danger full',style:'margin-top:8px',onclick:()=>{

      session=null; saveAll(); setInputVal=""; setView('dashboard');
    }
  }},['Cancel workout']);
  main.appendChild(cancelBtn);
}

function logSets(exId) {
  const ta=document.getElementById('set-input');
  if (!ta||!ta.value.trim()) return;
  const sets=parseSetInput(ta.value);
  if (!sets.length){showMsg("Format: 20 × 10  (weight × reps, one per line). Use 0 if no extra weight.","error");return;}
  if (!session.loggedSets[exId]) session.loggedSets[exId]=[];
  session.loggedSets[exId].push(...sets);
  setInputVal=""; saveAll(); render();
  setTimeout(()=>{const t=document.getElementById('set-input');if(t)t.focus();},50);
}

function removeSet(exId,idx) {
  session.loggedSets[exId].splice(idx,1);
  saveAll(); render();
}

function completeExercise(exId) {
  const ta=document.getElementById('set-input');
  // If there is text in the input box, try to parse it first.
  // If it fails to parse, block advancing and show an error.
  if (ta && ta.value.trim()) {
    const sets = parseSetInput(ta.value);
    if (!sets.length) {
      showMsg("Fix format first: e.g. 20 × 10 (weight × reps)", "error");
      return; // Stay on this exercise — do not advance
    }
    if (!session.loggedSets[exId]) session.loggedSets[exId]=[];
    session.loggedSets[exId].push(...sets);
    setInputVal="";
  }
  const ex=program.find(e=>e.id===exId);
  const logged=session.loggedSets[exId]||[];
  if (ex&&logged.length>0&&!ex.isCardio&&!ex.isTime) {
    const ts=calculateTopSet(logged,ex.repMin,ex.repMax);
    if (ts) {
      const sym=calculateProgression(ts,ex.repMin,ex.repMax);
      ex.topRep=ts.reps;
      ex.symbol=sym;
      maybeUpdateWeight(ex,ts,sym);
    }
  }
  session.exIndex++; setInputVal=""; saveAll(); render();
}

function skipExercise() {
  setInputVal=""; session.exIndex++; saveAll(); render();
}

async function finishWorkout() {
  const dayExes=program.filter(e=>e.day===session.day);
  const entry={
    date:new Date().toISOString(), day:session.day, dayName:DAY_NAMES[session.day],
    dayNotes:session.dayNotes,
    exercises:dayExes.map(e=>{
      const logged=session.loggedSets[e.id]||[];
      const ts=logged.length?calculateTopSet(logged,e.repMin,e.repMax):null;
      const sym=ts?calculateProgression(ts,e.repMin,e.repMax):(e.symbol||"");
      return{...e,loggedSets:logged,topRepSession:ts?ts.reps:null,symbolSession:sym,sessionNotes:session.notes[e.id]||""};
    })
  };
  history.push(entry);
  session.done=true;
  saveAll();
  showMsg("Workout saved!","success");
  await syncToGist();
  setTimeout(()=>setView('summary'),1000);
}

function downloadCSV(rows,filename){
  const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;a.click();
  URL.revokeObjectURL(url);
}

    }
    if(navigator.clipboard){navigator.clipboard.writeText(md).then(()=>showMsg('Markdown copied','success'));}
    else{const ta=document.createElement('textarea');ta.value=md;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);showMsg('Markdown copied','success');}
  }},['Copy markdown summary']));
  const impLbl=el('div',{class:'form-label',style:'margin-top:12px'},['Import program CSV']);
  const impIn=el('input',{type:'file',accept:'.csv'});
  impIn.style.cssText='border:none;background:none;padding:0;font-size:14px;color:var(--text)';
  impIn.onchange=e=>{
    if(!e.target.files[0]) return;
    const reader=new FileReader();
    reader.onload=ev=>{
      const lines=ev.target.result.split('\n').filter(l=>l.trim());
      const parseRow=l=>{const cols=[];let cur='',inQ=false;for(let ch of l){if(ch==='"')inQ=!inQ;else if(ch===','&&!inQ){cols.push(cur);cur='';}else cur+=ch;}cols.push(cur);return cols.map(c=>c.trim());};
      const header=parseRow(lines[0]);
      const imported=lines.slice(1).map(l=>{const r=parseRow(l);const obj={};header.forEach((h,i)=>obj[h]=r[i]);return{id:Date.now()+Math.random(),day:parseInt(obj.Day)||1,name:obj.Exercise||'',weight:parseFloat(obj.Weight)||0,startRes:parseFloat(obj.StartRes)||0,perHand:obj.PerHand==='1',symbol:obj.Symbol||'',topRep:parseInt(obj.TopRep)||0,sets:parseInt(obj.Sets)||3,repMin:parseInt(obj.RepMin)||8,repMax:parseInt(obj.RepMax)||12,notes:obj.Notes||''};}).filter(e=>e.name);
      if(confirm(`Import ${imported.length} exercises? This replaces the current program.`)){program=imported;saveAll();showMsg(`Imported ${imported.length} exercises`,'success');}
    };
    reader.readAsText(e.target.files[0]);
  };
  expCard.appendChild(impLbl); expCard.appendChild(impIn);
  main.appendChild(expCard);

  // Reset
  main.appendChild(el('div',{class:'section-label'},['Reset']));
  const resetCard=el('div',{class:'card card-body'});
  resetCard.appendChild(el('button',{class:'btn danger full',onclick:()=>{if(confirm('Reset current session?')){session=null;saveAll();showMsg('Session cleared','info');}}},['Reset current session']));
  resetCard.appendChild(el('button',{class:'btn danger full',onclick:()=>{if(confirm('Reset ALL data to factory defaults? Cannot be undone.')){program=DEFAULT_PROGRAM.map((e,i)=>({...e,id:i}));session=null;history=[];saveAll();showMsg('Reset to defaults','info');}}},['Reset all data to defaults']));
  main.appendChild(resetCard);

  // About
  main.appendChild(el('div',{class:'section-label'},['About']));
  const aboutCard=el('div',{class:'card card-body'});
  aboutCard.innerHTML=`<div style="font-size:13px;color:var(--text2);line-height:1.6"><strong style="color:var(--text)">${program.length}</strong> exercises &nbsp;·&nbsp; <strong style="color:var(--text)">${history.length}</strong> sessions logged<br>${hasToken?'Auto-syncing to GitHub Gist ✓':'Local storage only'}<br><br><strong style="color:var(--text)">To install on iPhone:</strong><br>Safari → Share → "Add to Home Screen"</div>`;
  main.appendChild(aboutCard);
}

// ============================================================
// INIT
// ============================================================
async function init() {
  const hasToken = !!getGistToken();
  if (hasToken) {
    setSyncBar('Connecting…');
    await loadFromGist();
  }
  render();
}

init();
</script>
</body>
</html>
